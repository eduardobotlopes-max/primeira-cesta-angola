const CHECKOUT_URL = "https://pay.clickpayon.com/94f51905-70c4-4a57-988a-28e39dec83f0";
let current=0, timer;
const root=document.getElementById('app');
function render(index){clearTimeout(timer);current=Math.max(0,Math.min(index,steps.length-1));root.innerHTML=steps[current];window.scrollTo(0,0);root.querySelectorAll('script').forEach(s=>s.remove());root.querySelectorAll('a[href*="inlead.digital"]').forEach(a=>{a.removeAttribute('href');a.textContent='Sua Primeira Cesta Vendida';});root.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()==='Central de anúncios')b.hidden=true;});root.querySelectorAll('.opacity-0').forEach(e=>{e.classList.remove('opacity-0');e.classList.add('opacity-100');});root.querySelectorAll('button').forEach(b=>{if(!b.textContent.trim()){b.setAttribute('aria-label','Voltar');b.onclick=()=>render(current===16?14:current-1);}else if(current<15)b.onclick=()=>{b.classList.add('active');setTimeout(()=>render(current+1),200);};else if(b.classList.contains('btn'))b.onclick=checkout;else if(current===16 && b.textContent.trim()!=='Central de anúncios'){b.setAttribute('aria-expanded','false');const answer=b.nextElementSibling;if(answer){answer.hidden=true;answer.style.gridTemplateRows='1fr';answer.style.height='auto';answer.style.maxHeight='none';b.onclick=()=>{answer.hidden=!answer.hidden;b.setAttribute('aria-expanded',String(!answer.hidden));};}}});root.querySelectorAll('a[href="#comprar"]').forEach(a=>a.onclick=e=>{e.preventDefault();checkout();});if(current===15){const bar=root.querySelector('.progress');if(bar){bar.style.transition='width 2s linear';requestAnimationFrame(()=>bar.style.width='100%');}timer=setTimeout(()=>render(16),2200);}}
